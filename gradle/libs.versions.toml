#
# TrustLens version catalog.
#
# Pins are aligned to Android Gradle Plugin 9.3.x (JDK 17, Gradle 9.5.0, build-tools 36.0.0,
# max compileSdk 37). Dependencies for camera, OCR, QR, ONNX and networking are added in the
# phase that first needs them — not up front.
#
[versions]
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.10"
hilt = "2.60.1"
androidxHilt = "1.4.0"

compileSdk = "37"
# targetSdk is deliberately 36, not 37: API 37 introduces behaviour changes (local-network
# access permission, audio hardening) that add risk without benefiting any TrustLens feature.
targetSdk = "36"
minSdk = "26"

androidxCore = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
material3 = "1.4.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
javaxInject = "1"

camerax = "1.6.2"
mlkitTextRecognition = "16.0.1"
mlkitBarcodeScanning = "17.3.0"

okhttp = "5.5.0"
# 1.11.0 is the newest stable; Maven advertises 1.12.0-RC as "release", which it is not.
kotlinxSerialization = "1.11.0"
onnxruntime = "1.29.0"
zxing = "3.5.3"

junit = "4.13.2"
truth = "1.4.5"
turbine = "1.2.1"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Bundled on-device text recognition: the model ships in the APK, so there is no
# first-run download to stall a scan and no image ever leaves the device.
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# Bundled barcode scanning. Decoding is local: the frame is never uploaded, and a
# decoded payload is only ever returned as a string for analysis.
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcodeScanning" }

# The only networking in TrustLens, confined to :threatintel.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# On-device inference for the trained scam classifier. CPU execution provider only;
# the NPU/GPU providers are a later phase and are not enabled here.
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }

# Test-only QR *encoder*, used to put a real QR image in front of the real on-device
# decoder during instrumented validation. Never shipped in the app.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android alias: AGP 9 has built-in Kotlin support, and applying
# org.jetbrains.kotlin.android on an Android module is an error.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
